name: hadith-api-probe
on:
  push:
    branches: [ccr-0045da50-p0vuyb]
    paths: ['.github/workflows/hadith-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe HadeethEnc API (2)
        shell: python
        run: |
          import json, urllib.request
          B = "https://hadeethenc.com/api/v1"
          def get(p):
              req = urllib.request.Request(B + p, headers={"User-Agent": "Mozilla/5.0"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          d = get("/hadeeths/list/?language=ru&category_id=4&page=1&per_page=2000")
          print("PP2000", len(d["data"]), d["meta"])
          cats = get("/categories/list/?language=ru")
          roots = [c for c in cats if not c["parent_id"]]
          rootids = {}
          for r in roots:
              rootids[r["id"]] = {x["id"] for x in get(f"/hadeeths/list/?language=ru&category_id={r['id']}&page=1&per_page=2000")["data"]}
          for k in [c for c in cats if c["parent_id"] == "3"][:6]:
              ids = {x["id"] for x in get(f"/hadeeths/list/?language=ru&category_id={k['id']}&page=1&per_page=2000")["data"]}
              print("CHILD", k["id"], k["hadeeths_count"], len(ids), "in root3:", len(ids & rootids["3"]))
          allids = set().union(*rootids.values())
          print("UNIQUE_RU_VIA_ROOTS", len(allids), {k: len(v) for k, v in rootids.items()})
          en = set()
          for r in roots:
              en |= {x["id"] for x in get(f"/hadeeths/list/?language=en&category_id={r['id']}&page=1&per_page=2000")["data"]}
          print("UNIQUE_EN_VIA_ROOTS", len(en))
          for hid in sorted(allids, key=int)[:80]:
              h = get(f"/hadeeths/one/?language=ar&id={hid}")
              if h.get("words_meanings"):
                  print("WM", hid, json.dumps(h["words_meanings"][:3], ensure_ascii=False))
                  break
          print("SAMPLE_LANGS", json.dumps(get("/languages"), ensure_ascii=False))
          print("SAMPLE_CATS", json.dumps(cats, ensure_ascii=False))
          print("SAMPLE_ONE_RU", json.dumps(get("/hadeeths/one/?language=ru&id=2962"), ensure_ascii=False))
          print("SAMPLE_ONE_RU2", json.dumps(get("/hadeeths/one/?language=ru&id=5907"), ensure_ascii=False))
          print("SAMPLE_LIST", json.dumps(get("/hadeeths/list/?language=ru&category_id=3&page=1&per_page=40"), ensure_ascii=False))
