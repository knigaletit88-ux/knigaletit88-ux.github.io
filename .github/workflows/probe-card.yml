# Временная проверка: работает ли сохранение карточки на настоящем сервере. Будет удалена.
name: Проверка сохранения карточки
on:
  push:
    branches: [ccr-0045da50-p0vuyb]
    paths: [".github/workflows/probe-card.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить сервер бота и мини-приложение
        run: |
          S=https://knigaletit88-uxgithubio-hadith-verc.vercel.app
          A=https://knigaletit88-ux.github.io/hadith
          echo "== OPTIONS /api/card (разрешение для мини-приложения)"
          curl -sS -o /dev/null -D - -X OPTIONS -H "Origin: https://knigaletit88-ux.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,x-init-data" "$S/api/card" | grep -iE "^HTTP|access-control"
          echo "== POST без подписи Telegram (ждём 401 auth)"
          curl -sS -w " -> %{http_code}\n" -X POST -H "Content-Type: application/octet-stream" --data-binary @/etc/hostname "$S/api/card?id=3362&lang=ru"
          echo "== POST с поддельной подписью (ждём 401 auth)"
          printf '\x89PNG\r\n\x1a\n1234' > card.png
          curl -sS -w " -> %{http_code}\n" -X POST -H "Content-Type: application/octet-stream" -H "X-Init-Data: user=%7B%22id%22%3A1%7D&auth_date=$(date +%s)&hash=00" --data-binary @card.png "$S/api/card?id=3362&lang=ru"
          echo "== GET с чужой подписью (ждём 403)"
          curl -sS -w " -> %{http_code}\n" "$S/api/card?f=X&n=hadith-1.png&s=bad"
          echo "== бот жив (/api/info)"
          curl -sS -w " -> %{http_code}\n" "$S/api/info"
          echo "== мини-приложение: новая кнопка сохранения"
          curl -sS "$A/app.js?nocache=$RANDOM" | grep -o "deliverCard\|downloadFile\|api/card" | sort | uniq -c
          echo "== хадис 3362 без &lt; &gt;"
          curl -sS "$A/data/ru/h/3362.json?nocache=$RANDOM" | grep -o "&lt;\|<Аллах Всевышний" | sort | uniq -c
